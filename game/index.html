<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lane — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#127880;</span>
      <div>
        <h1>Lantern Lane</h1>
        <p class="tagline">Spot the Difference &middot; three hand-drawn scenes, one sharp eye</p>
      </div>
    </div>
    <div class="hud" id="hud">
      <div class="hud-box">
        <span class="hud-label">Level</span>
        <span class="hud-value" id="hud-level">1 / 3</span>
      </div>
      <div class="hud-box found-box">
        <span class="hud-label">Found</span>
        <span class="hud-value" id="hud-found">0 / 5</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="hud-time">3:00</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="hud-score">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">Hints</span>
        <span class="hud-value" id="hud-hints">3</span>
      </div>
    </div>
  </header>

  <div id="timer-track" aria-hidden="true"><div id="timer-fill"></div></div>

  <main id="stage">
    <section class="panel" id="panel-left-wrap">
      <div class="panel-tag">A &middot; Original</div>
      <canvas id="panel-left" width="600" height="440" tabindex="0" aria-label="Left picture"></canvas>
    </section>
    <section class="panel" id="panel-right-wrap">
      <div class="panel-tag">B &middot; Changed</div>
      <canvas id="panel-right" width="600" height="440" tabindex="0" aria-label="Right picture"></canvas>
    </section>
  </main>

  <footer id="controls">
    <button id="btn-hint" type="button">Hint <kbd>H</kbd> <span id="hint-count"></span></button>
    <button id="btn-sound" type="button">Sound: On <kbd>M</kbd></button>
    <button id="btn-restart" type="button">Restart level <kbd>R</kbd></button>
    <button id="btn-menu" type="button">Levels <kbd>Esc</kbd></button>
    <span id="message" role="status" aria-live="polite"></span>
    <span id="combo" aria-hidden="true"></span>
  </footer>

  <div id="overlay" class="hidden">
    <div id="overlay-card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div id="overlay-stats"></div>
      <div id="overlay-buttons"></div>
      <p id="overlay-hint"></p>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
